# CI for the Godspeed Ops Portal (refactor plan D7, D8).
#   multiple-login-demo (push and pull request): type checks, lint, file-size ratchet, unit tests, then a local
#     Supabase built from migration_v2 and the full test suite (job "suite").
#   the four production branches (push): type checks and server lint only (job "static"); the drift check already proves
#     their code equals multiple-login-demo, this catches a cherry-pick that applies but does not compile.
#   multiple-login-demo (push and pull request), only when the client or the browser harness changed (or by hand):
#     the browser journeys (job "journeys", Playwright, Chromium) against a local Supabase, the real server and the
#     client, all on the runner (refactor plan D4.3, D7).
# It does not run on the public mirror: that repository's branch is `main`, which is not listed here.
# No secrets: the tests run against a local database with fake vendor keys and every outbound message recorded.
name: CI

on:
  push:
    branches:
      - multiple-login-demo
      - allstaff-production
      - canhire-production
      - godspeed-production
      - hdgroup-production
  pull_request:
    branches:
      - multiple-login-demo
  workflow_dispatch:

# a newer push to the same branch cancels the run in progress
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.28.2
  SUPABASE_CLI_VERSION: 2.113.0

jobs:
  static:
    name: Type checks, lint, file sizes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - name: Install client
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install server
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Type check (client)
        working-directory: client
        run: npx tsc --noEmit

      - name: Type check (server)
        working-directory: server
        run: npx tsc --noEmit

      # `pnpm lint` in client/ already fails today (81 errors, 55 warnings, none from the safety net), so this compares
      # the counts with scripts/client-lint-baseline.txt: nothing new, and the numbers only go down.
      # Only on multiple-login-demo: the production branches lack demo-only files, so their counts differ.
      - name: Lint (client, ratchet)
        if: github.ref_name == 'multiple-login-demo' || github.event_name != 'push'
        run: scripts/check-client-lint.sh

      # warnings only for now: the step fails on an error, not on a warning
      - name: Lint (server)
        working-directory: server
        run: pnpm lint

      # a ratchet: no new file over 300 lines, no listed file grows (scripts/check-file-size.sh)
      - name: File-size ratchet
        if: github.ref_name == 'multiple-login-demo' || github.event_name != 'push'
        run: scripts/check-file-size.sh

  suite:
    name: Unit tests and the full suite
    if: github.ref_name == 'multiple-login-demo' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      # the Supabase CLI starts the local test database in Docker (the runner has Docker and psql)
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install server
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Unit tests (nothing running)
        working-directory: server
        run: pnpm test:unit

      # builds the database from migration_v2, seeds it, starts the real server twice (real and fixed clock),
      # runs the access tests, the schema comparison and the API pins
      - name: Full suite
        working-directory: server
        run: pnpm test

      - name: What was running (only when something failed)
        if: failure()
        working-directory: server
        run: |
          docker ps -a
          supabase status || true

  # Decides whether the browser journeys run: when something that can change what the browser shows changed (the
  # client, the journeys themselves, or the test server and seed they run against), or when started by hand.
  changes:
    name: Did the client change?
    if: github.ref_name == 'multiple-login-demo' || github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          paths="client e2e server/tests/support server/tests/seed server/tests/scripts server/supabase .github/workflows/ci.yml"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "started by hand: running the journeys"; echo "browser=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            range="origin/$BASE_REF...HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            echo "no earlier commit to compare with: running the journeys"; echo "browser=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only $range -- $paths)
          if [ -n "$changed" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"; echo "changed:"; echo "$changed"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"; echo "nothing the browser shows changed: journeys skipped"
          fi

  journeys:
    name: Browser journeys (Playwright)
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install client
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install server
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install the journeys
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      # the browser download (about 100 MB) is cached by the Playwright version in the lock file
      - name: Playwright browser cache
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Download Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: System libraries for Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: e2e
        run: pnpm exec playwright install-deps chromium

      - name: Type check (journeys)
        working-directory: e2e
        run: pnpm typecheck

      # builds the database from migration_v2, seeds it, starts the real server and the client on this runner, and
      # drives Chromium through sign-in for every role and every Reports screen, in English and French
      - name: Browser journeys
        working-directory: e2e
        run: pnpm test:e2e

      - name: Traces and screenshots (only when something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-results
          path: e2e/test-results
          retention-days: 7
